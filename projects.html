<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Projects — NythEdit</title>
  <meta name="description" content="Your NythEdit video projects." />
  <link rel="stylesheet" href="main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="topbar-app">
    <a href="index.html" class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13l11-6.5z"/></svg></span>
      NythEdit
    </a>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
      <input type="search" id="searchInput" placeholder="Search projects…" aria-label="Search projects" />
    </div>
    <div class="ed-spacer"></div>
    <a href="editor.html?demo=1" class="btn btn-brand" id="newBtn">
      <svg class="i-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New project
    </a>
    <div class="avatar" id="avatarBtn" title="Account">S</div>
  </header>

  <div class="proj-hero">
    <h1>My projects</h1>
    <p>Pick up where you left off, or start something new.</p>
  </div>

  <div class="chips" id="chips">
    <button class="chip on" data-f="all">All</button>
    <button class="chip" data-f="video">Video</button>
    <button class="chip" data-f="short">Shorts</button>
    <button class="chip" data-f="draft">Drafts</button>
  </div>

  <main class="proj-grid-app" id="projGrid"></main>

  <div class="toast" id="toast"></div>
  <script src="main.js"></script>
</body>
</html>
