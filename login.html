<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — NythEdit</title>
  <meta name="description" content="Log in to NythEdit to access your video projects." />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="auth-page">

  <!-- left brand panel -->
  <aside class="auth-side">
    <a href="index.html" class="brand"><span class="brand-mark">✂</span> NythEdit</a>
    <div class="auth-quote">
      <p>"I cut a full product launch video on my lunch break. In a browser tab."</p>
      <cite>— Maya R., Content Lead</cite>
    </div>
    <p style="position:relative;color:#7c8199;font-size:.82rem">Trusted by 200,000+ creators worldwide</p>
  </aside>

  <!-- form -->
  <main class="auth-form-wrap">
    <div class="auth-card">
      <a href="index.html" class="brand" style="margin-bottom:26px"><span class="brand-mark">✂</span> NythEdit</a>
      <h1 id="authTitle">Welcome back</h1>
      <p id="authSub">Log in to pick up right where you left off.</p>

      <div class="form-err" id="formErr"></div>

      <button class="google-btn" id="googleBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.6 12.3c0-.8-.1-1.5-.2-2.3H12v4.5h6c-.3 1.4-1.1 2.5-2.4 3.3v2.8h3.9c2.3-2.1 3.1-5 3.1-8.3z"/><path fill="#34A853" d="M12 23c3.2 0 5.9-1.1 7.9-2.9l-3.9-2.8c-1.1.7-2.5 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v2.9C3.4 20.5 7.4 23 12 23z"/><path fill="#FBBC05" d="M5.4 13.6c-.2-.7-.4-1.5-.4-2.6s.1-1.9.4-2.6V5.5H1.4C.5 7.2 0 9 0 11s.5 3.8 1.4 5.5l4-2.9z"/><path fill="#EA4335" d="M12 4.7c1.8 0 3.3.6 4.6 1.8l3.4-3.4C17.9 1.1 15.2 0 12 0 7.4 0 3.4 2.5 1.4 6.5l4 2.9c.9-2.7 3.5-4.7 6.6-4.7z"/></svg>
        Continue with Google
      </button>

      <div class="auth-alt">or</div>

      <form id="authForm" novalidate>
        <div class="field" id="nameField" style="display:none">
          <label for="name">Full name</label>
          <input type="text" id="name" placeholder="Alex Carter" autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@studio.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button class="btn btn-dark btn-block btn-lg" type="submit" id="authSubmit">Log in →</button>
      </form>

      <p class="auth-switch"><span id="switchText">New to NythEdit?</span> <button type="button" id="switchMode">Create an account</button></p>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="js/main.js"></script>
</body>
</html>
